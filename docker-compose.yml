services:
  api:
    build: ./backend
    env_file: .env
    environment:
      # The SQLite database lives on a named volume so it survives rebuilds.
      SQLITE_PATH: /app/data/arxiv.sqlite3
    volumes:
      - sqlite-data:/app/data
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  sqlite-data:
